[project]
name = "inari"
version = "0.1.0"
description = "A golden, Strata-style monitoring TUI wrapper for llama.cpp's llama-server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7",
    "httpx>=0.27",
    "huggingface-hub>=0.24",
    "psutil>=5.9",
    "tomli-w>=1.0",
    "prompt-toolkit>=3.0",
]

[project.optional-dependencies]
# NVIDIA GPU load / temp / power / PCIe readings in the monitor
nvidia = ["nvidia-ml-py>=12"]

[project.scripts]
inari = "inari.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inari"]
